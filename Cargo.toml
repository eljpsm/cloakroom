[package]
name = "cloakroom"
version = "0.1.0"
edition = "2024"
# Floor set by the un-deprecation of std::env::home_dir, 1.87.
rust-version = "1.87"
license = "GPL-3.0-or-later"
autolib = false
publish = false
description = "Context-dependent Git identities compiled to native Git conditional includes."
repository = "https://github.com/eljpsm/cloakroom"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
tempfile = "3"
toml = "1"

[profile.release]
strip = true
lto = true

# Make plain `cargo clippy` and rust-analyzer as strict as CI. Clippy lints
# do not run under `cargo build`, so toolchain bumps cannot break `nix build`.
[lints.clippy]
all = "deny"
